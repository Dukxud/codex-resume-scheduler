name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PowerShell 7 syntax
        shell: pwsh
        run: |
          foreach ($source in Get-ChildItem -Path . -Recurse -Include '*.ps1','*.psm1','*.psd1' -File) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
            # The PowerShell $Host automatic variable is read-only. Assigning it
            # broke a real recovery path; reject the bug statically everywhere.
            $reserved = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
              $node.Left -is [System.Management.Automation.Language.VariableExpressionAst] -and
              $node.Left.VariablePath.UserPath -ieq 'host'
            }, $true))
            if ($reserved.Count) { throw "Reserved Host assignment in $($source.FullName)" }
          }
      - name: Prepare signed Microsoft WebView2 SDK
        shell: pwsh
        run: ./scripts/Prepare-AeroWebView2.ps1
      - name: Standalone AeroProgress API and signed-release gate
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/aero-component-contract.test.ps1
      - name: Verify both release ZIP inventories
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/release-bundle-integrity.test.ps1
      - name: Codex usage tests
        run: node --test tests/*.test.js
      - name: Appearance dialog and saved preferences
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/aero-appearance-dialog.test.ps1
      - name: Independent reusable component tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/reusable-components.test.ps1
      - name: Independently exercise Windows Task Scheduler adapter
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/independent-onetime-task.test.ps1
      - name: Inspect persisted run history and job-file pollution
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/codex-job-history.test.ps1
      - name: Prove standalone components in a separate application
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/second-application-reuse.test.ps1
      - name: Real worker failure exit-code propagation
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/worker-exit-status.test.ps1
      - name: Full scheduled worker with isolated Codex mock
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/codex-worker-integration.test.ps1
      - name: Actual Aero v3 Windows rendering
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/aero-webview-rendering.test.ps1
      - name: WebView2 crash recovery to WPF
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/aero-runtime-fallback.test.ps1
      - name: Upload Aero Windows rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-webview-windows-screenshots
          path: AeroScreenshots/*.png
          if-no-files-found: ignore
      - name: Repository ambiguity checks
        shell: pwsh
        run: ./tests/repository-detection.test.ps1
      - name: Scheduled retry behavior
        shell: pwsh
        run: ./tests/scheduler-retry.test.ps1
      - name: Model and access persistence checks
        shell: pwsh
        run: ./tests/model-and-session.test.ps1
      - name: Background refresh wiring
        shell: pwsh
        run: ./tests/background-refresh.test.ps1
      - name: UI draft persistence
        shell: pwsh
        run: ./tests/settings-persistence.test.ps1
      - name: Dashboard countdown calculations
        shell: pwsh
        run: ./tests/dashboard-countdown.test.ps1
      - name: WPF moving shine animation
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/wpf-flow-animation.test.ps1
      - name: Production WPF usage values
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/usage-progress-values.test.ps1
      - name: Dashboard bar rendering
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/dashboard-visuals.test.ps1
      - name: Dashboard window layout
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/dashboard-layout.test.ps1
      - name: Hidden script host launcher behavior
        shell: pwsh
        run: ./tests/script-host-launcher.test.ps1
      - name: Complete GUI startup smoke test
        shell: pwsh
        run: ./tests/full-gui-startup.test.ps1
      - name: Shipped launcher GUI visibility
        shell: pwsh
        run: ./tests/real-vbs-gui-visibility.test.ps1
      - name: Assemble versioned review ZIP
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-CodexScheduler.ps1 -OutputDirectory ./PreviewArtifacts -Preview
      - name: Assemble reusable AeroProgress component preview
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-AeroComponent.ps1 -OutputDirectory ./ComponentArtifacts -Preview
      - name: Package standalone reusable modules
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/Package-ReusableComponents.ps1 -OutputDirectory ./ReusableArtifacts -Preview
      - name: Upload standalone reusable modules
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ReusableComponents-Preview
          path: ReusableArtifacts/*.zip
          retention-days: 30
      - name: Upload standalone AeroProgress component
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AeroProgress-Component-Preview
          path: ComponentArtifacts/*.zip
          retention-days: 30
      - name: Upload integrated scheduler preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CodexResumeScheduler-v1.15.0-Adversarial-Modular-Preview
          path: PreviewArtifacts/*.zip
          retention-days: 30

  release:
    # Never publish an untested source-branch ZIP. Main is published only after
    # the complete Windows test suite succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare signed Microsoft WebView2 SDK
        shell: pwsh
        run: ./scripts/Prepare-AeroWebView2.ps1
      - name: Assemble numbered Windows release
        shell: pwsh
        env:
          CODEX_SIGNING_THUMBPRINT: ${{ secrets.CODEX_SIGNING_THUMBPRINT }}
          CODEX_TIMESTAMP_SERVER: ${{ vars.CODEX_TIMESTAMP_SERVER }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = ./scripts/Package-CodexScheduler.ps1 -OutputDirectory $env:RUNNER_TEMP -CertificateThumbprint $env:CODEX_SIGNING_THUMBPRINT -TimestampServer $env:CODEX_TIMESTAMP_SERVER
          $aero = ./scripts/Package-AeroComponent.ps1 -OutputDirectory $env:RUNNER_TEMP -CertificateThumbprint $env:CODEX_SIGNING_THUMBPRINT -TimestampServer $env:CODEX_TIMESTAMP_SERVER
          $modules = ./scripts/Package-ReusableComponents.ps1 -OutputDirectory $env:RUNNER_TEMP -CertificateThumbprint $env:CODEX_SIGNING_THUMBPRINT -TimestampServer $env:CODEX_TIMESTAMP_SERVER
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ARCHIVE=$archive"
          Add-Content -Path $env:GITHUB_ENV -Value "AERO_ARCHIVE=$aero"
          Add-Content -Path $env:GITHUB_ENV -Value "MODULES_ARCHIVE=$modules"
      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping it unchanged."; exit 0 }
          gh release create $tag $env:RELEASE_ARCHIVE $env:AERO_ARCHIVE $env:MODULES_ARCHIVE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title "Codex Resume Scheduler $tag" --notes "Original Windows v1.8 source colors with approved Aero Liquid v3 WebGL2 optics and fixed convex tip for usage limits and countdowns; Microsoft WebView2 SDK bundled, WPF fallback for unavailable runtime. Console-free Windows Script Host launcher; no custom executable or commercial libraries. Download the attached ZIP and open Start-Codex-Scheduler.vbs."
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release publishing failed.' }
