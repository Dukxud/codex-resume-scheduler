name: Tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare signed Microsoft WebView2 SDK
        shell: pwsh
        run: ./scripts/Prepare-AeroWebView2.ps1
      - name: Codex usage tests
        run: node --test tests/*.test.js
      - name: Actual Aero v3 Windows rendering
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/aero-webview-rendering.test.ps1
      - name: Upload Aero Windows rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-webview-windows-screenshots
          path: AeroScreenshots/*.png
          if-no-files-found: ignore
      - name: Repository ambiguity checks
        shell: pwsh
        run: ./tests/repository-detection.test.ps1
      - name: Scheduled retry behavior
        shell: pwsh
        run: ./tests/scheduler-retry.test.ps1
      - name: Model and access persistence checks
        shell: pwsh
        run: ./tests/model-and-session.test.ps1
      - name: Background refresh wiring
        shell: pwsh
        run: ./tests/background-refresh.test.ps1
      - name: UI draft persistence
        shell: pwsh
        run: ./tests/settings-persistence.test.ps1
      - name: Dashboard countdown calculations
        shell: pwsh
        run: ./tests/dashboard-countdown.test.ps1
      - name: WPF moving shine animation
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/wpf-flow-animation.test.ps1
      - name: Production WPF usage values
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/usage-progress-values.test.ps1
      - name: Dashboard bar rendering
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/dashboard-visuals.test.ps1
      - name: Dashboard window layout
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/dashboard-layout.test.ps1
      - name: Hidden script host launcher behavior
        shell: pwsh
        run: ./tests/script-host-launcher.test.ps1
      - name: Complete GUI startup smoke test
        shell: pwsh
        run: ./tests/full-gui-startup.test.ps1
      - name: Shipped launcher GUI visibility
        shell: pwsh
        run: ./tests/real-vbs-gui-visibility.test.ps1
      - name: PowerShell 7 syntax
        shell: pwsh
        run: |
          foreach ($source in Get-ChildItem -Path . -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          }

  release:
    # Never publish an untested source-branch ZIP. Main is published only after
    # the complete Windows test suite succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signed Microsoft WebView2 SDK
        shell: pwsh
        run: ./scripts/Prepare-AeroWebView2.ps1
      - name: Assemble numbered Windows release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION file.' }
          $bundleName = "CodexResumeScheduler-v$version"
          $folder = Join-Path $env:RUNNER_TEMP $bundleName
          [void](New-Item -ItemType Directory -Path $folder -Force)
          $files = @('CodexResumeScheduler.ps1','CodexDashboard.ps1',
            'CodexFlowingBar.ps1','CodexAeroBar.ps1','CodexData.ps1','CodexUsage.js','CodexRetry.js','Start-Codex-Scheduler.vbs',
            'Start-Codex-Scheduler.cmd','CodexRunJob.vbs','README.md','LICENSE','VERSION')
          foreach ($name in $files) {
            if (-not (Test-Path -LiteralPath $name -PathType Leaf)) { throw "Release file missing: $name" }
            Copy-Item -LiteralPath $name -Destination $folder
          }
          Copy-Item -LiteralPath assets -Destination $folder -Recurse
          Copy-Item -LiteralPath AeroWebView2 -Destination $folder -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "$bundleName.zip"
          Compress-Archive -Path $folder -DestinationPath $archive -Force
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ARCHIVE=$archive"
      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping it unchanged."; exit 0 }
          gh release create $tag $env:RELEASE_ARCHIVE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title "Codex Resume Scheduler $tag" --notes "Original Windows v1.8 source colors with approved Aero Liquid v3 WebGL2 optics and fixed convex tip for usage limits and countdowns; Microsoft WebView2 SDK bundled, WPF fallback for unavailable runtime. Console-free Windows Script Host launcher; no custom executable or commercial libraries. Download the attached ZIP and open Start-Codex-Scheduler.vbs."
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release publishing failed.' }
