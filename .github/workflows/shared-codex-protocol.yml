name: Shared interactive Codex protocol (bounded)
on:
  push:
    branches:
      - feat/shared-interactive-app-server
      - fix/continuum-windows-icon
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-codex-protocol
  cancel-in-progress: true

jobs:
  windows-protocol:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared owner and two-client interactive protocol
        shell: pwsh
        run: |
          node --test ./tests/shared-codex-session.test.mjs ./tests/shared-codex-remote.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shared interactive protocol or remote mock tests failed.' }
      - name: Inspect worker/bridge source and immutable runtime safety
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/flutter-port-source.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Worker source safety check failed.' }
          pwsh -NoProfile -STA -File ./tests/flutter-port-bridge.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows bridge regression failed.' }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Generate Windows Flutter runner
        shell: pwsh
        working-directory: flutter_port
        run: flutter create --platforms=windows --project-name codex_resume_flutter .

      - name: Apply and verify Continuum native window icon
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./flutter_port/Apply-WindowsIcon.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows icon patch failed.' }
          pwsh -NoProfile -File ./flutter_port/Apply-WindowsIcon.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Native icon did not survive verification.' }

      - name: Verify Flutter interactions and compile
        shell: pwsh
        working-directory: flutter_port
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { throw 'Flutter static analysis failed.' }
          flutter test --exclude-tags visual-capture
          if ($LASTEXITCODE -ne 0) { throw 'Flutter widget tests failed.' }
          flutter build windows --debug
          if ($LASTEXITCODE -ne 0) { throw 'Windows Flutter compile failed.' }

      - name: Compile unsigned release review package
        shell: pwsh
        working-directory: flutter_port
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Windows release compilation failed.' }

      - name: Verify compiled Continuum EXE icon, not just source asset
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/flutter-window-icon.test.ps1 -Executable ./flutter_port/build/windows/x64/runner/Release/codex_resume_flutter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows executable has incorrect branding icon.' }

      - name: Package and independently verify review ZIP
        shell: pwsh
        run: |
          pwsh -NoProfile -STA -File ./flutter_port/Build-WindowsPreview.ps1 -PackageVerifiedBuild -OutputDirectory ./flutter_port/build/review-out
          if ($LASTEXITCODE -ne 0) { throw 'Preview package verification failed.' }

      - name: Attach private Windows shared-session preview
        uses: actions/upload-artifact@v4
        with:
          name: shared-codex-windows-preview
          path: flutter_port/build/review-out/*.zip
          retention-days: 7
          if-no-files-found: error
